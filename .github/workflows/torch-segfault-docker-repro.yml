# TEMPORARY -- torch::install_torch() segfault reproduction, docker-build
# edition. Replaces the earlier torch-segfault-repro.yml, which ran inside a
# container instead of during a `docker build` (the context in which the
# crash was reported on the rOpenSci server; see ropensci/software-review#784
# and dev/torch-segfault/NOTES.md). Delete together with dev/torch-segfault/
# once the upstream report is settled.

name: torch-segfault-docker-repro

on:
    workflow_dispatch:
    push:
        branches:
            - torch-segfault-followup
        paths:
            - dev/torch-segfault/docker/**
            - .github/workflows/torch-segfault-docker-repro.yml

jobs:
    docker-build-repro:
        strategy:
            fail-fast: false
            matrix:
                variant: [faithful, no-arrow, source-torch, gdb]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Record runner environment
              run: |
                  { uname -a; docker version; lscpu | head -20; } \
                      | tee runner-environment-${{ matrix.variant }}.txt

            - name: docker build (${{ matrix.variant }})
              run: |
                  set -o pipefail
                  docker build --progress=plain --no-cache \
                      -f dev/torch-segfault/docker/Dockerfile.${{ matrix.variant }} \
                      -t torch-repro-${{ matrix.variant }} \
                      dev/torch-segfault/docker \
                      2>&1 | tee build-${{ matrix.variant }}.log

            - name: Upload build log
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: torch-docker-repro-${{ matrix.variant }}
                  path: |
                      build-${{ matrix.variant }}.log
                      runner-environment-${{ matrix.variant }}.txt
